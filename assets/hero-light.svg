<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
<style>
.type{animation:type 1.6s steps(24) .3s backwards}
@keyframes type{from{width:0}}
.ship{animation:ship 4s linear infinite}
@keyframes ship{0%,78%{fill:#FFFFFF}85%,97%{fill:#B9552F}100%{fill:#FFFFFF}}
.lbl{animation:lbl 4s linear infinite}
@keyframes lbl{0%,78%{fill:#59636E}85%,97%{fill:#B9552F}100%{fill:#59636E}}
</style>
<text x="0" y="62" font-size="44" font-weight="700" fill="#1F2328" letter-spacing="-1">Hi, I’m Jacky</text>
<defs><clipPath id="cp"><rect class="type" x="0" y="80" width="440" height="30"/></clipPath></defs>
<text x="0" y="102" clip-path="url(#cp)" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#59636E">AI Product Manager · PKU ’27</text>
<line x1="470" y1="88" x2="770" y2="88" stroke="#D1D9E0" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
<circle cx="470" cy="88" r="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
<circle cx="620" cy="88" r="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
<circle class="ship" cx="770" cy="88" r="6" fill="#FFFFFF" stroke="#B9552F" stroke-width="2"/>
<circle r="4" fill="#B9552F">
  <animate attributeName="cx" values="470;770;770" keyTimes="0;0.8;1" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.86;1" dur="4s" repeatCount="indefinite"/>
  <set attributeName="cy" to="88"/>
</circle>
<g font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="1.5" text-anchor="middle">
<text x="470" y="118" fill="#59636E">PRD</text>
<text x="620" y="118" fill="#59636E">BUILD</text>
<text class="lbl" x="770" y="118" fill="#59636E">SHIP</text>
</g>
<text x="470" y="62" font-size="17" fill="#59636E">既定义 AI 产品，也亲手把它搭出来</text>
</svg>